<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<title>Админ-панель</title>
<style>
:root{--primary:#6366F1;--pl:#A5B4FC;--bg:#05060A;--card:#0B0E17;--hover:#101528;--text:#E8EAF2;--mut:#7A859C;--bd:#1A2033;--bd2:#252D45;--ok:#22C55E;--bad:#F87171;--font:'Inter','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font)}
a{color:var(--pl)}button,input,select{font:inherit;color:inherit}
input,select{background:var(--bg);border:1px solid var(--bd2);border-radius:8px;padding:9px 12px;width:100%;outline:0}
input:focus,select:focus{border-color:var(--primary)}
input[type=checkbox]{width:auto;accent-color:var(--primary);cursor:pointer}
input[readonly]{opacity:.7}
button{background:var(--primary);border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.45;cursor:not-allowed;filter:none}
button.g{background:transparent;border:1px solid var(--bd2)}button.d{background:#7f1d1d}button.s{padding:5px 10px;font-size:12px}
:focus-visible{outline:2px solid var(--pl);outline-offset:2px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px}
.center{min-height:100vh;display:grid;place-items:center;padding:16px}.center .box{width:100%;max-width:400px;display:grid;gap:12px}
h1{font-size:20px}h2{font-size:16px;margin-bottom:12px}.mut{color:var(--mut);font-size:13px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.head h2{margin:0}
.layout{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{border-right:1px solid var(--bd);padding:18px 12px;display:grid;gap:4px;align-content:start;background:var(--card)}
nav b{padding:6px 10px 2px;font-size:16px}nav .me{padding:0 10px 14px;font-size:12px;color:var(--mut);word-break:break-all}
nav button{background:none;text-align:left;color:var(--mut)}nav button.on{background:var(--hover);color:var(--text)}
nav #ses{padding:10px;font-size:11px;color:var(--mut)}
main{padding:24px;overflow:auto;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}.stat b{display:block;font-size:24px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px}
table{width:100%;border-collapse:collapse}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-weight:500;font-size:12px}
td.wrap{white-space:normal;min-width:240px;word-break:break-word}
th.sort{cursor:pointer;user-select:none}th.sort:hover{color:var(--text)}
tbody tr:hover td,tr:hover>td{background:var(--hover)}
tr:last-child td{border:0}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:12px}
.bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}.bar input{max-width:280px}.bar select{max-width:220px;width:auto}
.sum{margin:-4px 0 12px}
.tag{padding:2px 8px;border-radius:99px;font-size:11px;border:1px solid var(--bd2)}.tag.admin{color:var(--pl);border-color:var(--primary)}.tag.ban{color:var(--bad);border-color:var(--bad)}.tag.ok{color:var(--ok);border-color:var(--ok)}
dialog{background:var(--card);color:var(--text);border:1px solid var(--bd2);border-radius:14px;padding:22px;width:min(480px,94vw);max-height:92vh;overflow:auto;margin:auto}
dialog::backdrop{background:#000a}dialog form,.stack{display:grid;gap:10px}.row{display:flex;gap:8px}.row>*{flex:1}
label{font-size:12px;color:var(--mut);display:grid;gap:4px}
label.chk{display:flex;gap:8px;align-items:center}
hr{border:0;border-top:1px solid var(--bd);margin:4px 0}
code,.mono{font-family:ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:2px 6px;word-break:break-all}
div.mono{padding:10px;line-height:1.9;max-height:220px;overflow:auto}
#toast{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:9;max-width:min(420px,92vw)}#toast div{background:var(--card);border:1px solid var(--bd2);padding:10px 14px;border-radius:10px}#toast .e{border-color:var(--bad)}
@media(max-width:720px){.layout{grid-template-columns:1fr}nav{grid-auto-flow:column;overflow-x:auto;border:0;border-bottom:1px solid var(--bd)}nav b,nav .me,nav #ses{display:none}main{padding:14px}}
</style>
</head>
<body>
<noscript>Для работы админки нужен JavaScript.</noscript>
<div id="app"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="dlg"></dialog>
<script src="/admin.js"></script>
</body>
</html>
